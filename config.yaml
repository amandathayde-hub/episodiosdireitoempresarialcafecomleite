# Configurações gerais do site de episódios.
# Edite com cuidado: mantenha os dois-pontos e os espaços do começo das linhas.

rss: https://anchor.fm/s/654b6580/podcast/rss
playlist_youtube: https://www.youtube.com/playlist?list=PLW-zVBq6n2zkv-lylH2GNdULBLJr8zB9n

site:
  titulo: Episódios – Direito Empresarial Café com Leite
  url: https://episodios.direitoempresarialcafecomleite.com
  site_principal: https://podcast.direitoempresarialcafecomleite.com/

transcricao:
  # local = roda o Whisper na própria máquina do GitHub (grátis, padrão)
  # groq  = envia o áudio ao Groq (precisa do segredo GROQ_API_KEY; em
  #         2026-10 o Groq cortava palavras acentuadas, por isso não é o padrão)
  # nenhuma = não transcreve; episódios novos ficam como "transcrição pendente"
  fonte: local
  modelo_local: large-v3-turbo
  modelo_groq: whisper-large-v3-turbo
  idioma: pt
  # Só para a fonte groq: quantos episódios por execução.
  maximo_por_execucao: 60
