# Configurações gerais do site de episódios.
# Edite com cuidado: mantenha os dois-pontos e os espaços do começo das linhas.

rss: https://anchor.fm/s/654b6580/podcast/rss
playlist_youtube: https://www.youtube.com/playlist?list=PLW-zVBq6n2zkv-lylH2GNdULBLJr8zB9n
# Onde mais procurar o vídeo quando o episódio não está na playlist acima.
youtube_extras:
  - https://www.youtube.com/@AmandaAthayde/videos
  - https://www.youtube.com/@AmandaAthayde/streams

site:
  titulo: Busca de episódios – Direito Empresarial Café com Leite
  nome_podcast: Direito Empresarial Café com Leite
  # Endereço público do site (domínio próprio configurado no GitHub Pages
  # e no DNS da Hostinger; ver CHECKLIST.md).
  url: https://episodios.direitoempresarialcafecomleite.com
  dominio: episodios.direitoempresarialcafecomleite.com
  site_principal: https://podcast.direitoempresarialcafecomleite.com/
  spotify_programa: https://open.spotify.com/show/3rgLXFIScTgCGHqidktCG1
  youtube_canal: https://www.youtube.com/@AmandaAthayde/videos
  # Estatísticas de visitas sem cookies (GoatCounter). Deixe vazio para desligar.
  goatcounter: https://direitoempresarialcafecomleite.goatcounter.com/count
  # Imagem usada ao compartilhar no WhatsApp/LinkedIn (capa do podcast no feed).
  capa: https://d3t3ozftmdmh3i.cloudfront.net/production/podcast_uploaded_nologo/16894400/16894400-1627131207535-00d258608c1d3.jpg

transcricao:
  # local = roda o Whisper na própria máquina do GitHub (grátis, padrão)
  # groq  = envia o áudio ao Groq (precisa do segredo GROQ_API_KEY; em
  #         2026-10 o Groq cortava palavras acentuadas, por isso não é o padrão)
  # nenhuma = não transcreve; episódios novos ficam como "transcrição pendente"
  fonte: local
  modelo_local: large-v3-turbo
  modelo_groq: whisper-large-v3-turbo
  idioma: pt
  # Só para a fonte groq: quantos episódios por execução.
  maximo_por_execucao: 60

# Relatório mensal de visitas (GoatCounter), enviado por e-mail pelo GitHub
# no dia 1º de cada mês. "codigo" é o começo do endereço do painel
# (codigo.goatcounter.com).
relatorio_visitas:
  avisar: amandathayde-hub
  sites:
    - nome: Site de episódios (busca)
      codigo: direitoempresarialcafecomleite
