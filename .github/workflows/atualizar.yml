name: Atualizar episódios

on:
  schedule:
    # Horários em UTC. 09:07 UTC = 06:07 em Brasília. As outras execuções
    # adiantam a carga inicial das transcrições; sem novidades, terminam rápido.
    - cron: "7 9 * * *"
    - cron: "7 15 * * *"
    - cron: "7 21 * * *"
    - cron: "7 3 * * *"
  # Quando o código ou as correções mudam, roda de novo sozinho.
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config.yaml"
      - "overrides.yaml"
      - "temas.yaml"
      - "requirements.txt"
      - ".github/workflows/atualizar.yml"
  # Botão de emergência (Actions > Atualizar episódios > Run workflow).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar programas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt

      - name: Ler RSS e YouTube, transcrever pendentes
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/atualizar.py --transcrever

      - name: Guardar novidades no repositório
        if: always()
        run: |
          git config user.name "atualizacao-automatica"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data transcripts
          if git diff --cached --quiet; then
            echo "Nada novo."
          else
            git commit -q -m "Atualização automática dos episódios"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          fi
