name: Atualizar episódios

on:
  schedule:
    # Horários em UTC. 09:07 UTC = 06:07 em Brasília. As outras execuções
    # adiantam a carga inicial das transcrições; sem novidades, terminam rápido.
    - cron: "7 9 * * *"
    - cron: "7 15 * * *"
    - cron: "7 21 * * *"
    - cron: "7 3 * * *"
  # Quando o código ou as correções mudam, roda de novo sozinho.
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config.yaml"
      - "overrides.yaml"
      - "temas.yaml"
      - "requirements.txt"
      - ".github/workflows/atualizar.yml"
  # Botão de emergência (Actions > Atualizar episódios > Run workflow).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      # Sempre a versão mais nova do main (não a do momento em que a
      # execução foi agendada), para não refazer o que outra já fez.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar programas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt

      - name: Ler RSS e YouTube, transcrever pendentes
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/atualizar.py --transcrever

      - name: Guardar novidades no repositório
        if: always()
        run: |
          git config user.name "atualizacao-automatica"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tentativa in 1 2 3; do
            git add data transcripts
            if git diff --cached --quiet; then
              echo "Nada novo."
              exit 0
            fi
            git commit -q -m "Atualização automática dos episódios"
            if saida=$(git push origin HEAD:main 2>&1); then
              echo "::notice title=Gravado::Novidades gravadas no repositório."
              exit 0
            fi
            # O main mudou durante a execução: parte da versão nova, acrescenta
            # só as transcrições que ainda não existem lá e refaz os dados.
            echo "::warning title=Main mudou (tentativa $tentativa)::refazendo sobre a versão nova"
            mkdir -p /tmp/novas && cp transcripts/*.txt /tmp/novas/ 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p transcripts && cp -n /tmp/novas/*.txt transcripts/ 2>/dev/null || true
            python scripts/atualizar.py
          done
          echo "::error title=Não consegui gravar::o main mudou três vezes seguidas"
          exit 1
