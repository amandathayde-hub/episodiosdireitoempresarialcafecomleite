name: Verificar site publicado (uso técnico)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verificar-site.yml"

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Conferir HTTPS do domínio e acesso entre sites (CORS)
        run: |
          d=episodios.direitoempresarialcafecomleite.com
          cert=$(echo | openssl s_client -connect $d:443 -servername $d 2>/dev/null | openssl x509 -noout -subject -enddate 2>&1 | tr '\n' ' ')
          echo "::notice title=Certificado::$cert"
          r=$(curl -sS -o /dev/null -m 20 -w "%{http_code}" https://$d/ 2>&1 | tail -1)
          echo "::notice title=HTTPS::$r"
          cors=$(curl -sSI -m 20 http://$d/static/episodios.json | grep -i "access-control-allow-origin" | tr -d '\r')
          echo "::notice title=CORS::${cors:-sem cabeçalho}"
          p=$(dig +short A podcast.direitoempresarialcafecomleite.com | tr '\n' ' ')
          echo "::notice title=Servidor do WordPress::$p"
