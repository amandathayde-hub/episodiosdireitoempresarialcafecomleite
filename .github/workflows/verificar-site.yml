name: Verificar site publicado (uso técnico)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verificar-site.yml"

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Procurar o código do episódio no Spotify
        run: |
          link="https://podcasters.spotify.com/pod/show/direito-empresarial-caf-com-leite/episodes/328-GUTINIEKI--Joo-Otvio-Bacchi--A-tutela-do-Direito-da-Concorrncia-no-Poder-Judicirio-o-private-enforcement-do-antitruste-no-Brasil--Londrina-Thoth--2025-e3qoj36"
          final=$(curl -sSL -o /tmp/p -m 30 -w "%{http_code} %{url_effective}" -A "Mozilla/5.0" "$link")
          ids=$(grep -oE 'open\.spotify\.com/(embed/)?episode/[A-Za-z0-9]{22}' /tmp/p | sort -u | head -3 | tr '\n' ' ')
          echo "::notice title=Página do episódio::$final | ids: ${ids:-nenhum} | tamanho $(wc -c < /tmp/p)"
          for id in $(grep -oE 'open\.spotify\.com/(embed/)?episode/[A-Za-z0-9]{22}' /tmp/p | grep -oE '[A-Za-z0-9]{22}$' | sort -u); do
            ctx=$(grep -oE ".{0,160}$id.{0,60}" /tmp/p | head -2 | tr '\n' ' ' | tr -d '<>')
            echo "::notice title=Contexto $id::$ctx"
          done
