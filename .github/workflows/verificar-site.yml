name: Verificar site publicado (uso técnico)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verificar-site.yml"

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Conferir a versão publicada do bloco da página inicial
        run: |
          u=https://episodios.direitoempresarialcafecomleite.com/static/lista-embed.js
          h=$(curl -sSI -m 20 $u | grep -iE "^(cache-control|last-modified|age|x-cache):" | tr -d '\r' | tr '\n' ' ')
          n=$(curl -sS -m 20 $u | grep -c "Como navegar pelos")
          echo "::notice title=lista-embed.js::versão nova presente: $n | $h"
          w=$(curl -sS -m 30 -A "Mozilla/5.0" https://podcast.direitoempresarialcafecomleite.com/ | grep -oE '<script[^>]*lista-embed[^>]*>' | head -2 | tr -d '<>')
          echo "::notice title=WordPress carrega::${w:-não encontrado}"
