name: Diagnóstico da transcrição

# Roda só quando o script de diagnóstico muda (uso técnico, não precisa de clique).
on:
  push:
    branches: [main]
    paths:
      - "scripts/diagnostico_groq.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar programas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper
          nproc
      - name: Comparar formatos e modelos
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PULAR_GROQ: "1"
        run: python scripts/diagnostico_groq.py 288
