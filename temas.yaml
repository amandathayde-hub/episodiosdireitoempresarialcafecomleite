# TEMAS E PALAVRAS-CHAVE (proposta para aprovação)
#
# Como funciona: um episódio recebe um tema quando alguma palavra-chave
# aparece no TÍTULO ou na DESCRIÇÃO, ou aparece pelo menos
# "minimo_na_transcricao" vezes na TRANSCRIÇÃO.
# Acentos e maiúsculas não importam ("falencia" = "Falência").
# Um episódio pode ter vários temas. Para corrigir um episódio específico,
# use "temas:" no overrides.yaml.

minimo_na_transcricao: 5

