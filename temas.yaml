# TEMAS E PALAVRAS-CHAVE
#
# Como funciona: um episódio recebe um tema quando alguma palavra-chave
# aparece no TÍTULO ou na DESCRIÇÃO, ou quando as palavras-chave do tema
# aparecem, somadas, pelo menos "minimo_na_transcricao" vezes na TRANSCRIÇÃO
# (sem contar a abertura e o encerramento padrão do podcast).
# Acentos e maiúsculas não importam ("falencia" = "Falência").
# Um episódio pode ter VÁRIOS temas ao mesmo tempo.
# Para corrigir um episódio específico, use "temas:" no overrides.yaml.
#
# Os temas estão organizados em grupos (aparecem assim no filtro do site).

