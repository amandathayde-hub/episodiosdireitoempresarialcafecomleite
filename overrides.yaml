# CORREÇÕES MANUAIS
# O que estiver aqui vale mais do que o que o sistema descobre sozinho.
#
# Como usar:
#   - Cada episódio é identificado pelo número que aparece no site
#     (ex.: "60") ou, para episódios sem número, pelo código "extra-AAAA-MM-DD".
#   - Use sempre aspas no identificador.
#   - Campos possíveis em cada episódio:
#       numero:      número correto do episódio
#       convidados:  quem participa do episódio, na forma "Nome Sobrenome"
#       autores:     autores da obra comentada, quando não são os convidados
#       temas:       lista de temas (substitui a classificação automática)
#       youtube:     código do vídeo (o que vem depois de "watch?v=" no link)
#       ocultar:     true  (esconde o episódio do site)
#   - Linhas que começam com # são comentários e são ignoradas.

episodios:
  "560":            # o feed diz #EP560, mas é o episódio 60
    numero: 60
  "82":             # título traz só as iniciais "PATELLA, L. A."
    convidados: ["Laura Amaral Patella"]
  "58":             # título diz "JUSTINO, Manoel Justino"; quem comenta é Maria Fabiana Sant'Ana
    autores: ["Manoel Justino Bezerra Filho", "Cassio Cavalli"]
  "266":            # artigo de Bertrand Wanderer
    convidados: ["Bertrand Wanderer"]
  "285":            # título escrito "MARTINS. Guilherme V."
    convidados: ["Guilherme Vinseiro Martins"]
  "314":            # no YouTube este episódio foi publicado como "#114"
    youtube: "4ekEghNHt1k"

